<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Framed login</title>
  </head>
  <body style="font: 14px system-ui">
    <form>
      <input id="user" autocomplete="username" style="display: block; margin: 6px; padding: 6px" />
      <input
        id="pass"
        type="password"
        autocomplete="current-password"
        style="display: block; margin: 6px; padding: 6px"
      />
    </form>
  </body>
</html>
