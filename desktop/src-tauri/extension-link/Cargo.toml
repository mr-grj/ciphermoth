[package]
name = "ciphermoth-extension-link"
version = "0.1.0"
edition = "2021"
publish = false
description = "The link between the CipherMoth browser extension and the desktop app: framing, the paired channel, local IPC and native-host manifests."

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
