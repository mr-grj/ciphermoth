name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check . ../docker/smoke

      - name: Format check
        working-directory: backend
        run: uv run ruff format --check . ../docker/smoke

      - name: Type check
        working-directory: backend
        run: uv run ty check . ../docker/smoke

  backend-tests:
    name: Backend tests (pytest, ${{ matrix.platform.slug }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            slug: amd64
          - runner: ubuntu-24.04-arm
            slug: arm64
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Check the SQLite runtime
        working-directory: backend
        run: uv run python -c "import platform, sqlite3, storage; storage.require_supported_sqlite(); print(platform.machine(), 'SQLite', sqlite3.sqlite_version)"

      - name: Test
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend (ESLint + Prettier + Vitest, ${{ matrix.platform.slug }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            slug: amd64
          - runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Test the image's runtime configuration
        run: node --test docker/frontend/runtime-config.test.mjs

      - name: Test the dependency audit's accepted advisories
        run: node --test scripts/npm_audit.test.mjs

  frontend-browser:
    name: Frontend image (CSP in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docker/frontend/browser/package-lock.json

      - name: Build the frontend image
        run: docker build -f docker/frontend/Dockerfile --build-arg VITE_API_URL=__CIPHERMOTH_API_URL__ -t ciphermoth-frontend:browser-test .

      - name: Install the browser
        working-directory: docker/frontend/browser
        run: npm ci && npx playwright install --with-deps chromium

      - name: Check the Content-Security-Policy
        working-directory: docker/frontend/browser
        run: npm test

  extension:
    name: Browser extension (types, ESLint, Prettier, Vitest, web-ext lint, reproducible build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Type check
        working-directory: extension
        run: npm run typecheck

      - name: Lint
        working-directory: extension
        run: npm run lint

      - name: Format check
        working-directory: extension
        run: npm run format:check

      - name: Unit tests (URL vectors, messages, manifests, clipboard, packages)
        working-directory: extension
        run: npm test

      - name: Build both packages twice and compare
        working-directory: extension
        run: |
          npm run package
          cp dist/packages/SHA256SUMS "$RUNNER_TEMP/SHA256SUMS"
          node scripts/verify.mjs "$RUNNER_TEMP/SHA256SUMS"

      # The packages of this commit, byte-identical to what a release of it
      # builds: the first Chrome Web Store upload is made from these
      # (extension/store/chrome-web-store.md).
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: |
            extension/dist/packages/ciphermoth-extension-*
            extension/dist/packages/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

      - name: web-ext lint (Firefox)
        working-directory: extension
        run: npm run lint:firefox

  extension-e2e:
    name: Browser extension e2e and attack lab (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json

      - name: Install frontend and extension dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix extension

      - name: Install Chromium
        working-directory: extension
        run: npx playwright install --with-deps chromium

      # Desktop mode: the real native host (QA identity) and the app stand-in
      # (rust-toolchain.toml pins the toolchain; rustup is on the runner).
      - name: Build the native host and the desktop app stand-in
        working-directory: desktop/src-tauri
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/extension/.e2e/cargo
        run: |
          cargo build --locked -p ciphermoth-native-host --features qa
          cargo build --locked -p ciphermoth-extension-link --example app_stub

      - name: Flows and attack lab against a live backend
        working-directory: extension
        run: npm run test:e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-report
          path: |
            extension/playwright-report
            extension/test-results
          retention-days: 7

  images:
    name: Images and Compose install (${{ matrix.platform.slug }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            slug: amd64
          - runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build the production images
        run: |
          docker build -f docker/backend/Dockerfile -t ghcr.io/mr-grj/ciphermoth-backend:ci .
          docker build -f docker/frontend/Dockerfile --build-arg VITE_API_URL=__CIPHERMOTH_API_URL__ -t ghcr.io/mr-grj/ciphermoth-frontend:ci .

      - name: Check that released updaters refuse the images
        run: |
          for image in backend frontend; do
            label="$(docker image inspect ghcr.io/mr-grj/ciphermoth-$image:ci --format '{{json .Config.Labels}}')"
            echo "$image: $label"
            echo "$label" | grep -q '"io.ciphermoth.min-updater-protocol":"3"'
          done

      - name: Install and exercise the Compose stack and install.sh
        run: |
          python3 docker/smoke/compose_smoke.py --tag ci --prefix cm-ci \
            --installer
