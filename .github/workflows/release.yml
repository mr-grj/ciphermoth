name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          test "$GITHUB_REPOSITORY" = "mr-grj/ciphermoth"
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          version="${GITHUB_REF#refs/tags/v}"
          python desktop/release/version.py --check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The browser extension: reproducible packages (docs/EXTENSION.md), checked
  # by rebuilding, then the Firefox package signed by addons.mozilla.org as an
  # unlisted add-on when the AMO credentials exist in the protected
  # extension-release environment. Store uploads (Chrome Web Store, AMO
  # listing) stay manual for now.
  extension:
    needs: source
    runs-on: ubuntu-latest
    environment: extension-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install dependencies
        working-directory: extension
        run: npm ci
      - name: Test, lint and build reproducibly
        working-directory: extension
        run: |
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          npm run typecheck
          npm run lint
          npm test
          npm run package
          cp dist/packages/SHA256SUMS "$RUNNER_TEMP/SHA256SUMS"
          node scripts/verify.mjs "$RUNNER_TEMP/SHA256SUMS"
          npm run lint:firefox
      - name: Sign the Firefox package (unlisted, addons.mozilla.org)
        if: env.AMO_JWT_ISSUER != ''
        working-directory: extension
        run: |
          npx web-ext sign --channel unlisted --source-dir dist/firefox \
            --artifacts-dir "$RUNNER_TEMP/signed" \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          cp "$RUNNER_TEMP"/signed/*.xpi "dist/packages/ciphermoth-extension-firefox-$RELEASE_VERSION.xpi"
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: extension/dist/packages/ciphermoth-extension-*
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: |
            extension/dist/packages/ciphermoth-extension-*
          if-no-files-found: error

  desktop:
    needs: source
    uses: ./.github/workflows/desktop.yml
    with:
      release: true
    secrets: inherit
    permissions:
      contents: read

  # Build each architecture on its own NATIVE runner (no QEMU). Emulated arm64
  # Node/Vite builds took ~26 min and timed out; native arm64 builds in a couple
  # of minutes. Each job pushes an untagged, digest-only image; the merge job
  # stitches the per-arch digests into one multi-arch tag and signs it.
  build:
    needs: source
    name: build ${{ matrix.image.name }} (${{ matrix.platform.slug }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ciphermoth-backend
            dockerfile: docker/backend/Dockerfile
            args: ""
          - name: ciphermoth-frontend
            dockerfile: docker/frontend/Dockerfile
            # Baked placeholder; entrypoint.sh swaps in the real URL at runtime.
            args: VITE_API_URL=__CIPHERMOTH_API_URL__
        platform:
          - arch: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.arch }}
          build-args: ${{ matrix.image.args }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into one multi-arch tag, then cosign-sign the
  # resulting manifest-list digest (the digest `cosign verify` checks).
  merge:
    name: merge & sign ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [build, desktop]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - ciphermoth-backend
          - ciphermoth-frontend
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Resolve manifest-list digest
        id: digest
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          digest="$(docker buildx imagetools inspect "${image}:${{ steps.meta.outputs.version }}" --format '{{ json .Manifest.Digest }}' | tr -d '\"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  smoke:
    needs: [source, merge]
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ needs.source.outputs.version }}
    permissions:
      contents: read

  publish:
    needs: [source, desktop, smoke, extension]
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-packages-*
          path: release-assets
          merge-multiple: true
      - name: Install verifier prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Verify every signature and generate the manifest
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          mkdir -p desktop/core/dist/ciphermoth-core frontend/dist
          echo '<!doctype html>' > frontend/dist/index.html
          cd desktop/src-tauri
          cargo build --release --example verify_update
          cd ../..
          python desktop/release/manifest.py --artifacts release-assets --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --verifier desktop/src-tauri/target/release/examples/verify_update --public-key release-assets/updater.pub
          cd release-assets && sha256sum -c SHA256SUMS
      - uses: actions/download-artifact@v4
        with:
          name: extension-packages
          path: extension-assets
      - name: Add the browser extension packages
        run: |
          cd extension-assets
          ls ciphermoth-extension-chromium-*.zip ciphermoth-extension-firefox-*.zip
          for file in ciphermoth-extension-*; do
            test ! -e "../release-assets/$file"
            cp "$file" ../release-assets/
            sha256sum "$file" >> ../release-assets/SHA256SUMS
          done
          cd ../release-assets && sha256sum -c SHA256SUMS
      - name: Stage and publish the complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: python desktop/release/publish.py "$RELEASE_VERSION" release-assets
