name: Desktop spike

on:
  push:
    branches: ["experiment/desktop-feasibility"]
    paths:
      - "experiments/desktop-spike/**"
      - ".github/workflows/desktop-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.15"
  OPENSSL_VERSION: "4.0.1"
  WEBKIT_DISABLE_DMABUF_RENDERER: "1"
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  spike:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-15
            bundles: app,dmg
            skip: applescript_quit
          - id: macos-x64
            runner: macos-15-intel
            bundles: app,dmg
            skip: applescript_quit
            openssl: darwin64-x86_64-cc
          - id: windows-x64
            runner: windows-latest
            bundles: nsis
          - id: windows-arm64
            runner: windows-11-arm
            bundles: nsis
            vcpkg_openssl: arm64-windows-static-md
          - id: linux-x64
            runner: ubuntu-22.04
            bundles: deb
            appimage: true
          - id: linux-arm64
            runner: ubuntu-22.04-arm
            bundles: deb
            appimage: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Record runner
        run: |
          mkdir -p spike-results
          {
            echo "runner=${{ matrix.runner }}"
            uname -a || true
            if [ "$RUNNER_OS" = "macOS" ]; then sw_vers; sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; fi
            if [ "$RUNNER_OS" = "Linux" ]; then lsb_release -a 2>/dev/null; nproc; free -m; fi
            if [ "$RUNNER_OS" = "Windows" ]; then systeminfo | head -30; fi
          } > spike-results/runner.txt 2>&1 || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (if missing)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              case "$PROCESSOR_ARCHITECTURE" in ARM64) triple=aarch64-pc-windows-msvc ;; *) triple=x86_64-pc-windows-msvc ;; esac
              curl -fsSL -o rustup-init.exe "https://static.rust-lang.org/rustup/dist/$triple/rustup-init.exe"
              ./rustup-init.exe -y --profile minimal
              echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            else
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            fi
          fi

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file \
            xvfb xauth dbus-x11 lsof

      - name: Static OpenSSL for cryptography (macOS without wheel)
        if: matrix.openssl
        run: |
          start=$(date +%s)
          OPENSSL_EXTRA_FLAGS="-mmacosx-version-min=11.0 no-module" \
            experiments/desktop-spike/core/build_openssl.sh "${{ matrix.openssl }}" "$RUNNER_TEMP/openssl" 2>/dev/null
          echo "OPENSSL_DIR=$RUNNER_TEMP/openssl" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "openssl_build_s=$(( $(date +%s) - start ))" >> spike-results/source-builds.txt

      - name: Static OpenSSL for cryptography (Windows without wheel)
        if: matrix.vcpkg_openssl
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          C:\vcpkg\vcpkg.exe install "openssl:${{ matrix.vcpkg_openssl }}" --disable-metrics
          "OPENSSL_DIR=C:\vcpkg\installed\${{ matrix.vcpkg_openssl }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "vcpkg_openssl_s=$([int]$sw.Elapsed.TotalSeconds)" | Out-File -FilePath spike-results/source-builds.txt -Append
          C:\vcpkg\vcpkg.exe list openssl | Out-File -FilePath spike-results/source-builds.txt -Append

      - name: Build, test and measure
        run: |
          uv python install "$PYTHON_VERSION"
          skip=()
          if [ -n "${{ matrix.skip }}" ]; then skip=(--skip ${{ matrix.skip }}); fi
          uv run --no-project --python "$PYTHON_VERSION" experiments/desktop-spike/harness/spike_ci.py \
            --target "${{ matrix.id }}" --python "$PYTHON_VERSION" --bundles "${{ matrix.bundles }}" \
            --out spike-results --repeat 8 \
            --stages core vectors core_tests app install lifecycle "${skip[@]}"

      - name: AppImage
        if: matrix.appimage && always()
        continue-on-error: true
        run: |
          cd experiments/desktop-spike/app
          start=$(date +%s)
          CI=true npx tauri build --bundles appimage --ci && ok=1 || ok=0
          echo "appimage_build_ok=$ok appimage_build_s=$(( $(date +%s) - start ))" >> ../../../spike-results/source-builds.txt
          cd ../../..
          if [ "$ok" = 1 ]; then
            uv run --no-project --python "$PYTHON_VERSION" experiments/desktop-spike/harness/spike_ci.py --target "${{ matrix.id }}" --bundles appimage \
              --out spike-results/appimage --stages appimage || true
          fi
          ls -la experiments/desktop-spike/app/src-tauri/target/release/bundle/appimage >> spike-results/source-builds.txt 2>&1 || true

      - name: Linux package and runtime inspection
        if: runner.os == 'Linux' && always()
        run: |
          {
            dpkg-deb -I experiments/desktop-spike/app/src-tauri/target/release/bundle/deb/*.deb
            echo "--- ldd shell"
            ldd /usr/bin/ciphermoth-desktop-spike | sort
            echo "--- glibc"
            ldd --version | head -1
            echo "--- webkit"
            dpkg -l | grep -E "libwebkit2gtk|libjavascriptcoregtk"
            echo "--- core needs"
            objdump -T experiments/desktop-spike/core/dist/ciphermoth-core/_internal/libpython3*.so* 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3
          } > spike-results/linux-inspection.txt 2>&1 || true

      - name: WebView2 loopback probe
        if: runner.os == 'Windows' && always()
        continue-on-error: true
        run: |
          py=experiments/desktop-spike/core/build/venv/Scripts/python.exe
          exe="$($py -c "import json;print(json.load(open('spike-results/summary.json'))['stages']['install']['executable'])")"
          netstat -ano > spike-results/netstat-before.txt 2>&1 || true
          $py experiments/desktop-spike/harness/port80_probe.py --duration 5 --out spike-results/port80-owners.json || true
          pwsh -NoProfile -File experiments/desktop-spike/harness/http_sys_probe.ps1 \
            -Out spike-results/http-sys-probe.json -StopFile spike-results/probe.stop \
            -ReadyFile spike-results/probe.ready -Duration 600 &
          for i in $(seq 1 150); do [ -f spike-results/probe.ready ] && break; sleep 0.2; done
          $py experiments/desktop-spike/harness/lifecycle.py --app "$exe" \
            --out spike-results/lifecycle-http-sys.json --only ipc_selftest canary_scan || true
          netstat -ano > spike-results/netstat-during-probe.txt 2>&1 || true
          touch spike-results/probe.stop
          wait

      - name: Windows Defender scan
        if: runner.os == 'Windows' && always()
        shell: pwsh
        continue-on-error: true
        run: |
          $out = "spike-results/defender.txt"
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion, AMEngineVersion | Format-List | Out-File $out
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          foreach ($path in @("experiments\desktop-spike\core\dist\ciphermoth-core", "experiments\desktop-spike\app\src-tauri\target\release\bundle\nsis")) {
            "=== $path" | Out-File $out -Append
            & $mp -Scan -ScanType 3 -File (Resolve-Path $path) -DisableRemediation 2>&1 | Out-File $out -Append
            "exit=$LASTEXITCODE" | Out-File $out -Append
          }
          Get-AuthenticodeSignature "experiments\desktop-spike\app\src-tauri\target\release\bundle\nsis\*.exe" | Format-List | Out-File $out -Append

      - name: macOS signature inspection
        if: runner.os == 'macOS' && always()
        run: |
          app="$(ls -d "$HOME/cm-spike-install/"*.app 2>/dev/null | head -1)"
          {
            codesign -dv --verbose=2 "$app" 2>&1
            codesign --verify --deep --strict --verbose=2 "$app" 2>&1
            spctl --assess --type execute -vv "$app" 2>&1
            lipo -archs "$app/Contents/MacOS/"* 2>&1
            otool -l "$app/Contents/Resources/core/_internal/cryptography/hazmat/bindings/_rust.abi3.so" | grep -A4 LC_BUILD_VERSION
          } > spike-results/macos-signature.txt 2>&1 || true

      - name: Upload results (no binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-results-${{ matrix.id }}
          path: spike-results/
          retention-days: 14
