name: Scheduled checks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Audit backend runtime dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit frontend dependencies
        run: node scripts/npm_audit.mjs frontend

      - name: Audit the frontend image's file server
        run: node scripts/npm_audit.mjs docker/frontend/serve

      - name: Audit the browser extension's dependencies
        run: node scripts/npm_audit.mjs extension

      - name: Check the pinned frontend base for updates
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          refs = re.findall(r"^FROM (node:\S+)", Path("docker/frontend/Dockerfile").read_text(), re.M)
          if len(refs) != 2 or len(set(refs)) != 1:
              raise SystemExit("Review both frontend Node base references together.")
          tag, _, pinned = refs[0].partition("@")
          current = subprocess.check_output(
              ["docker", "buildx", "imagetools", "inspect", tag, "--format", "{{.Manifest.Digest}}"],
              text=True, timeout=60,
          ).strip()
          if pinned != current:
              raise SystemExit(f"Frontend base changed upstream; review {tag}@{current} and update the pin.")
          PY

  stress:
    name: Stress tests (fuzzing, process kills)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON_PREFERENCE: only-managed
      HYPOTHESIS_PROFILE: stress
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Test
        working-directory: backend
        run: uv run pytest -m "stress or not stress"
