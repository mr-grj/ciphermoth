name: Scheduled checks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Audit backend runtime dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Audit frontend dependencies
        run: node scripts/npm_audit.mjs frontend

      - name: Audit the frontend image's file server
        run: node scripts/npm_audit.mjs docker/frontend/serve

      - name: Audit the browser extension's dependencies
        run: node scripts/npm_audit.mjs extension

  stress:
    name: Stress tests (fuzzing, process kills)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON_PREFERENCE: only-managed
      HYPOTHESIS_PROFILE: stress
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Test
        working-directory: backend
        run: uv run pytest -m "stress or not stress"
